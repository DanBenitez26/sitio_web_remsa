{% extends "base.html" %}

    <h1 class="h3 mt-3">¡Solicitud enviada con éxito!</h1>
    <p class="text-muted">Tu folio de seguimiento es:</p>

    <a href="{% url 'paginas:home' %}" class="btn btn-navy mt-3">Volver al inicio</a>

</section>
